version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Dependabot PRs for both ecosystems above are validated by the CI
  # workflow (.github/workflows/ci.yml), which runs on `pull_request` for
  # every PR including Dependabot's — fmt/clippy/test/doc on real Linux,
  # Windows, and macOS runners.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
