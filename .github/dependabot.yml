version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

# A "github-actions" ecosystem entry is intentionally not configured here.
# Dependabot's github-actions updater requires at least one workflow file
# (/action.yml or /.github/workflows/*.yml) to have anything to scan, and
# this project deliberately has none yet (see ARCHITECTURE.md / README.md's
# non-goals: no CI workflows have been added). Add the entry back — the
# original block, mirroring the "cargo" one above with
# package-ecosystem: "github-actions" — once a workflow file exists.
