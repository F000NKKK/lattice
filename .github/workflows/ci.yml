name: CI

# Runs on each of the three platforms this project actually ships backends
# for (net-lattice-backend-linux/-windows/-darwin), on GitHub's native
# runners for each OS — not cross-compiled — so platform-specific code
# (raw FFI structs, ioctl/Netlink/IP-Helper calls) is compiled *and*
# clippy-linted on the real target instead of only ever building on Linux.
# Each backend crate is `#![cfg(target_os = "...")]`-gated, so a workspace
# build/clippy/test run on a given OS naturally only touches that OS's
# backend plus the OS-agnostic crates — no extra target selection needed.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo doc --no-deps --workspace
        run: cargo doc --no-deps --workspace

      # The add/remove-route round-trip test in each backend is #[ignore]d
      # by default (see each crate's test module) because it needs elevated
      # privileges to actually touch the routing table — CAP_NET_ADMIN on
      # Linux, root on macOS, Administrator on Windows. Each one is scoped
      # to a documentation-only prefix (RFC 5737 TEST-NET-3) on the
      # loopback interface and cleans up after itself regardless of
      # assertion outcome, so it's safe to run against the runner's real
      # routing table.
      - name: cargo test --ignored (privileged, Linux — sudo for CAP_NET_ADMIN)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo env "PATH=$PATH" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" \
            cargo test -p net-lattice-backend-linux -- --ignored

      - name: cargo test --ignored (privileged, macOS — sudo for root)
        if: matrix.os == 'macos-latest'
        run: |
          sudo env "PATH=$PATH" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" \
            cargo test -p net-lattice-backend-darwin -- --ignored

      # GitHub-hosted Windows runners already execute as Administrator, so
      # no elevation step is needed here — unlike the sudo re-exec above.
      - name: cargo test --ignored (privileged, Windows — already Administrator)
        if: matrix.os == 'windows-latest'
        run: cargo test -p net-lattice-backend-windows -- --ignored
